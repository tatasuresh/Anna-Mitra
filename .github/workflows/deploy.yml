name: Deploy to Railway

# Railway's own GitHub trigger is not connected for this project, so this workflow
# deploys the Anna-Mitra service whenever main changes, then runs the end-to-end
# tests against the deployed app.
#
# One-time setup: in Railway, open the project's Settings -> Tokens, create a project
# token for the production environment, and save it in this repository under
# Settings -> Secrets and variables -> Actions as RAILWAY_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push replaces a queued one.
concurrency:
  group: railway-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_URL: https://anna-mitra-production.up.railway.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Check the Railway token is set
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::The RAILWAY_TOKEN repository secret is not set. Create a project token in Railway (Settings -> Tokens) and add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service Anna-Mitra

  e2e:
    # Runs after every deploy. A failure here turns the run red but does not undo the deploy.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Wait for the new version to answer
        run: |
          # The container runs the schema push and seed before it serves, so allow a few minutes.
          curl --fail --silent --show-error --output /dev/null \
            --retry 30 --retry-delay 10 --retry-all-errors --max-time 20 "$APP_URL/login"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests
        env:
          BASE_URL: ${{ env.APP_URL }}
        run: npx playwright test

      - name: Keep the test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
